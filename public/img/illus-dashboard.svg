<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" font-family="Manrope, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17407a"/>
      <stop offset=".55" stop-color="#0a1f3c"/>
      <stop offset="1" stop-color="#061529"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="8%" r="60%">
      <stop offset="0" stop-color="#d9b76a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#d9b76a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b76a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#d9b76a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ead39e"/>
      <stop offset="1" stop-color="#c9a24a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
  </defs>

  <rect width="560" height="600" fill="url(#bg)"/>
  <rect width="560" height="600" fill="url(#grid)"/>
  <rect width="560" height="600" fill="url(#glow)"/>

  <!-- window header -->
  <g transform="translate(300 52)">
    <rect width="220" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="20" cy="17" r="5" fill="#d9b76a"/>
    <text x="36" y="22" font-size="13" font-weight="700" fill="#ffffff" fill-opacity=".8">Business funding overview</text>
  </g>

  <!-- main chart card -->
  <g transform="translate(40 110)">
    <rect width="480" height="250" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="28" y="44" font-size="14" font-weight="600" fill="#ffffff" fill-opacity=".6">Available working capital</text>
    <text x="28" y="86" font-size="36" font-weight="800" fill="#ffffff">$248,600</text>
    <rect x="366" y="28" width="88" height="30" rx="15" fill="url(#gold)"/>
    <text x="410" y="48" font-size="13" font-weight="800" fill="#061529" text-anchor="middle">▲ 18.4%</text>
    <g stroke="#ffffff" stroke-opacity=".07">
      <line x1="28" y1="130" x2="452" y2="130"/>
      <line x1="28" y1="170" x2="452" y2="170"/>
      <line x1="28" y1="210" x2="452" y2="210"/>
    </g>
    <path d="M28 214 C70 205 90 190 128 196 S190 170 226 176 S290 140 330 146 S400 108 452 100 L452 228 L28 228 Z" fill="url(#area)"/>
    <path d="M28 214 C70 205 90 190 128 196 S190 170 226 176 S290 140 330 146 S400 108 452 100" fill="none" stroke="#d9b76a" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="452" cy="100" r="7" fill="#ead39e"/>
    <circle cx="452" cy="100" r="16" fill="#ead39e" fill-opacity=".2"/>
  </g>

  <!-- donut card -->
  <g transform="translate(40 385)">
    <rect width="230" height="175" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="24" y="38" font-size="13" font-weight="600" fill="#ffffff" fill-opacity=".6">Approval rate</text>
    <g transform="translate(115 106)">
      <circle r="44" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="13"/>
      <circle r="44" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round" stroke-dasharray="221 277" transform="rotate(-90)"/>
      <text y="7" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">80%+</text>
    </g>
  </g>

  <!-- bars card -->
  <g transform="translate(290 385)">
    <rect width="230" height="175" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="24" y="38" font-size="13" font-weight="600" fill="#ffffff" fill-opacity=".6">Monthly sales</text>
    <g fill="#5b86c4" fill-opacity=".7">
      <rect x="24" y="112" width="20" height="40" rx="5"/>
      <rect x="54" y="100" width="20" height="52" rx="5"/>
      <rect x="84" y="106" width="20" height="46" rx="5"/>
      <rect x="114" y="86" width="20" height="66" rx="5"/>
      <rect x="144" y="74" width="20" height="78" rx="5"/>
    </g>
    <rect x="174" y="56" width="20" height="96" rx="5" fill="url(#gold)"/>
  </g>
</svg>
