<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf0f9"/>
      <stop offset="1" stop-color="#f7efdc"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ead39e"/>
      <stop offset="1" stop-color="#c9a24a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <circle cx="320" cy="60" r="90" fill="#ffffff" fill-opacity=".55"/>

  <!-- growth bars behind -->
  <g fill="#17407a" fill-opacity=".1">
    <rect x="236" y="150" width="26" height="80" rx="4"/>
    <rect x="270" y="120" width="26" height="110" rx="4"/>
    <rect x="304" y="88" width="26" height="142" rx="4"/>
    <rect x="338" y="56" width="26" height="174" rx="4"/>
  </g>
  <!-- growth arrow -->
  <path d="M206 170 L262 128 L294 146 L356 74" fill="none" stroke="#c9a24a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M332 70 L360 70 L360 98" fill="none" stroke="#c9a24a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- storefront -->
  <rect x="44" y="230" width="312" height="6" rx="3" fill="#0a1f3c" fill-opacity=".15"/>
  <g transform="translate(60 92)">
    <rect x="0" y="34" width="170" height="104" rx="6" fill="#ffffff"/>
    <rect x="0" y="34" width="170" height="104" rx="6" fill="none" stroke="#0a1f3c" stroke-opacity=".12"/>
    <!-- awning -->
    <path d="M-8 34 L178 34 L170 4 L0 4 Z" fill="#0a1f3c"/>
    <g fill="url(#gold)">
      <path d="M14 4 L36 4 L38 34 L12 34 Z"/>
      <path d="M62 4 L84 4 L86 34 L60 34 Z"/>
      <path d="M110 4 L132 4 L134 34 L108 34 Z"/>
      <path d="M158 4 L170 4 L178 34 L156 34 Z"/>
    </g>
    <path d="M-8 34 q11.6 14 23.2 0 q11.6 14 23.2 0 q11.6 14 23.2 0 q11.6 14 23.2 0 q11.6 14 23.2 0 q11.6 14 23.2 0 q11.6 14 23.2 0 q11.6 14 23.2 0" fill="#0a1f3c"/>
    <!-- window -->
    <rect x="14" y="62" width="82" height="52" rx="4" fill="#cfdcf0"/>
    <path d="M14 62 L44 62 L22 114 L14 114 Z" fill="#ffffff" fill-opacity=".6"/>
    <rect x="14" y="62" width="82" height="52" rx="4" fill="none" stroke="#17407a" stroke-width="3"/>
    <!-- door -->
    <rect x="110" y="58" width="44" height="80" rx="4" fill="#17407a"/>
    <rect x="118" y="66" width="28" height="30" rx="3" fill="#cfdcf0"/>
    <circle cx="146" cy="104" r="3" fill="#ead39e"/>
    <!-- open sign -->
    <rect x="26" y="74" width="40" height="16" rx="3" fill="#c9a24a"/>
    <rect x="31" y="80" width="30" height="4" rx="2" fill="#ffffff"/>
  </g>
  <!-- plant -->
  <rect x="236" y="208" width="18" height="22" rx="3" fill="#c9a24a"/>
  <circle cx="245" cy="198" r="14" fill="#1f9d6b" fill-opacity=".8"/>
  <circle cx="236" cy="190" r="9" fill="#1f9d6b" fill-opacity=".6"/>
</svg>
