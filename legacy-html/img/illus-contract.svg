<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf0f9"/>
      <stop offset="1" stop-color="#e3eaf5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ead39e"/>
      <stop offset="1" stop-color="#c9a24a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <circle cx="330" cy="210" r="100" fill="#f7efdc" fill-opacity=".8"/>

  <!-- contract document -->
  <g transform="translate(60 30) rotate(-4)">
    <rect x="0" y="0" width="150" height="196" rx="10" fill="#ffffff" stroke="#0a1f3c" stroke-opacity=".1"/>
    <rect x="18" y="20" width="70" height="10" rx="4" fill="#0a1f3c"/>
    <g fill="#0a1f3c" fill-opacity=".14">
      <rect x="18" y="46" width="114" height="6" rx="3"/>
      <rect x="18" y="60" width="104" height="6" rx="3"/>
      <rect x="18" y="74" width="110" height="6" rx="3"/>
      <rect x="18" y="88" width="84" height="6" rx="3"/>
      <rect x="18" y="108" width="114" height="6" rx="3"/>
      <rect x="18" y="122" width="96" height="6" rx="3"/>
    </g>
    <line x1="18" y1="172" x2="96" y2="172" stroke="#0a1f3c" stroke-opacity=".3" stroke-width="2"/>
    <path d="M22 166 c8 -18 14 4 20 -6 s10 -10 14 2 s10 -4 18 -2" fill="none" stroke="#17407a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- seal -->
    <circle cx="122" cy="166" r="18" fill="url(#gold)"/>
    <path d="M114 166 l6 6 l10 -12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- clock / payday -->
  <g transform="translate(262 52)">
    <circle cx="50" cy="50" r="50" fill="#0a1f3c"/>
    <circle cx="50" cy="50" r="40" fill="none" stroke="#ffffff" stroke-opacity=".15" stroke-width="2"/>
    <path d="M50 10 A40 40 0 0 1 90 50" fill="none" stroke="#d9b76a" stroke-width="6" stroke-linecap="round"/>
    <path d="M50 26 V50 L66 60" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="50" r="5" fill="#ead39e"/>
  </g>

  <!-- coin stack -->
  <g transform="translate(250 172)">
    <g fill="url(#gold)" stroke="#b08a35" stroke-width="1.5">
      <ellipse cx="34" cy="52" rx="30" ry="9"/>
      <rect x="4" y="38" width="60" height="14"/>
      <ellipse cx="34" cy="38" rx="30" ry="9"/>
      <rect x="4" y="24" width="60" height="14"/>
      <ellipse cx="34" cy="24" rx="30" ry="9"/>
      <rect x="4" y="10" width="60" height="14"/>
      <ellipse cx="34" cy="10" rx="30" ry="9"/>
    </g>
    <g fill="url(#gold)" stroke="#b08a35" stroke-width="1.5">
      <ellipse cx="102" cy="52" rx="30" ry="9"/>
      <rect x="72" y="38" width="60" height="14"/>
      <ellipse cx="102" cy="38" rx="30" ry="9"/>
    </g>
  </g>
</svg>
